name: Make

on: [ push, pull_request ]

jobs:

  build-release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcovr

      - name: Build Release
        run: bin/dev/build.sh RPI sources RELEASE install

      - name: Create Release Archive
        run: |
          mkdir -p archive
          cp build/hexapod-RPI-RELEASE/src/Hexapodcpp archive/ || exit 1
          ls -lh archive/

      - name: Upload Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: hexapodcpp-rpi-release
          path: archive/Hexapodcpp


  run-tests:
    name: Run Google Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Google Test
        run: bin/dev/test.sh all

      - name: Archive Test Results
        if: always()
        run: |
          mkdir -p archive
          cp build/hexapod-X64-TEST/test_results.xml archive/ || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: archive/test_results.xml
          if-no-files-found: warn


  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcovr

      - name: Configure (with coverage flags)
        run: |
          cmake -S . -B build/coverage \
            -DGTEST=1 \
            -DTARGET=X64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage"

      - name: Build
        run: cmake --build build/coverage -- -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build/coverage

      - name: Generate coverage report
        run: |
          lcov --capture \
               --directory build/coverage \
               --output-file coverage.info \
               --ignore-errors mismatch \
               --ignore-errors gcov

          lcov --remove coverage.info "/usr/*" "*/tests/*" -o coverage.info

          genhtml coverage.info --output-directory coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report


  cppcheck:
    name: Static Analysis (Cppcheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck on src/ (exclude build/)
        run: |
          cppcheck \
            --enable=all \
            --inconclusive \
            --force \
            --inline-suppr \
            --language=c++ \
            --xml \
            --xml-version=2 \
            --exclude=build \
            src 2> cppcheck-report.xml

      - name: Upload Cppcheck Report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.xml


  docker-cross-build-rpi:
    name: Docker Cross-Compile (RPi Zero 2 W - ARM64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Pull Toolchain Image
        run: docker pull loumagrule/hexapodcpp:rpi-toolchain

      - name: Cross-Compile for RPi (${{ matrix.build_type }})
        run: |
          BUILD_TYPE="${{ matrix.build_type }}"
          BUILD_DIR="build/rpi-${BUILD_TYPE,,}"

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loumagrule/hexapodcpp:rpi-toolchain \
            bash -c "cmake -Wno-dev -S . -B $BUILD_DIR \
              -DCMAKE_TOOLCHAIN_FILE=/workspace/cmake/toolchain-rpi-zero-2-w.cmake \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DTARGET=RPI \
              -DOPENSSL_USE_STATIC_LIBS=OFF \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            && cmake --build $BUILD_DIR --target Hexapodcpp -- -j\$(nproc)"

      - name: Upload RPi Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexapodcpp-rpi-${{ matrix.build_type }}
          path: build/rpi-${{ matrix.build_type }}/src/Hexapodcpp
