name: Make

on: [ push, pull_request ]

jobs:

  build-X64:
    name: Build X64
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [ DEBUG, RELEASE ]

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ cmake

      - name: Build ${{ matrix.build_type }}
        run: bin/dev/build.sh X64 sources ${{ matrix.build_type }}

      - name: Upload ${{ matrix.build_type }} Binary
        uses: actions/upload-artifact@v6
        with:
          name: hexapodcpp-X64-${{ matrix.build_type }}
          path: build/hexapod-X64-${{ matrix.build_type }}/src/Hexapodcpp

  build-HMI:
    name: Build HMI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: HMI

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HMI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Upload HMI build
        uses: actions/upload-artifact@v6
        with:
          name: hmi-dist
          path: HMI/dist

  run-tests:
    name: Run Google Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Run Google Test
        run: bin/dev/test.sh all

      - name: Archive Test Results
        if: always()
        run: |
          mkdir -p archive
          cp build/hexapod-X64-TEST/test_results.xml archive/ || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: archive/test_results.xml
          if-no-files-found: warn

  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcovr

      - name: Run Coverage
        run: bin/dev/coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage-report

  clang-tidy:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-20

      - name: Run clang-tidy
        run: bin/dev/clang-tidy.sh
        env:
          CLANG_TIDY: clang-tidy-20

      - name: Upload clang-tidy Report
        uses: actions/upload-artifact@v6
        with:
          name: clang-tidy-report
          path: |
            clang-tidy-report/report.txt

  cppcheck:
    name: Static Analysis (Cppcheck)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: bin/dev/cppcheck.sh

      - name: Upload Cppcheck Report
        uses: actions/upload-artifact@v6
        with:
          name: cppcheck-report
          path: |
            cppcheck-report.xml
            cppcheck_html

  build-RPI:
    name: Docker Cross-Compile (RPI Zero 2 W - ARM64)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [ DEBUG, RELEASE ]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build Toolchain Image (Dockerfile.rpi-zero2)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rpi-zero2
          target: toolchain
          tags: hexapodcpp:rpi-toolchain
          load: true
          cache-from: type=gha,scope=rpi-toolchain
          cache-to: type=gha,mode=max,scope=rpi-toolchain

      - name: Cross-Compile for RPI (${{ matrix.build_type }})
        run: bin/dev/docker-build-rpi.sh ${{ matrix.build_type }}
        env:
          HEXAPOD_SKIP_IMAGE_BUILD: 1

      - name: Upload RPi Artifact
        uses: actions/upload-artifact@v6
        with:
          name: hexapodcpp-RPI-${{ matrix.build_type }}
          path: build/hexapod-RPI-${{ matrix.build_type }}/src/Hexapodcpp

  