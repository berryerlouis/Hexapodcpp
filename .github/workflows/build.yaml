name: Make

on: [push, pull_request]

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gcc
        run: |
          sudo apt update
          sudo apt install build-essential binutils

      - name: Build Release
        run: |
          bin/dev/build.sh RPI sources RELEASE install

      - name: Create Release Archive
        run: |
          mkdir -p archive
          if [ -f "build/hexapod-RPI-RELEASE/src/Hexapodcpp" ]; then
            cp build/hexapod-RPI-RELEASE/src/Hexapodcpp archive/
            ls -lh archive/
          fi

      - name: Upload Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: hexapodcpp-rpi-release
          path: archive/Hexapodcpp
          if-no-files-found: error

  run-tests:
    name: Run Google Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gcc
        run: |
          sudo apt update
          sudo apt install build-essential binutils

      - name: Run Google Test
        run: |
          bin/dev/test.sh all

      - name: Create Test Archive
        if: always()
        run: |
          mkdir -p archive
          if [ -f "build/hexapod-X64-TEST/test_results.xml" ]; then
            cp build/hexapod-X64-TEST/test_results.xml archive/
          fi
          ls -lh archive/ || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: archive/test_results.xml
          if-no-files-found: warn

  docker-cross-build-rpi:
    name: Docker Cross-Compile (RPi Zero 2 W - ARM64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Toolchain Image
        run: |
          docker build -f Dockerfile.rpi-zero2 --target toolchain --build-arg INSTALL_CORP_CERTS=false -t hexapodcpp:rpi-toolchain .

      - name: Cross-Compile for RPi (${{ matrix.build_type }})
        run: |
          BUILD_TYPE="${{ matrix.build_type }}"
          BUILD_DIR="build/rpi-$(echo $BUILD_TYPE | tr '[:upper:]' '[:lower:]')"
          
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            hexapodcpp:rpi-toolchain \
            bash -c "cmake -Wno-dev -S . -B $BUILD_DIR \
              -DCMAKE_TOOLCHAIN_FILE=/workspace/cmake/toolchain-rpi-zero-2-w.cmake \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DTARGET=RPI \
              -DOPENSSL_USE_STATIC_LIBS=OFF \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            && cmake --build $BUILD_DIR --target Hexapodcpp -- -j\$(nproc)"

      - name: Verify Binary
        run: |
          BUILD_TYPE="${{ matrix.build_type }}"
          BUILD_DIR="build/rpi-$(echo $BUILD_TYPE | tr '[:upper:]' '[:lower:]')"
          file $BUILD_DIR/src/Hexapodcpp
          ls -lh $BUILD_DIR/src/Hexapodcpp

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexapodcpp-rpi-arm64-${{ matrix.build_type }}
          path: |
            build/rpi-*/src/Hexapodcpp
