<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hexapod</title>
        <link rel="stylesheet" href="./style.css" type="text/css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="popup" id="popup"></div>
        <div id="panel"></div>
        <div class="header">
            <div class="header-left">
                <h1>Hexapod<span id="version">V0.0</span></h1>
            </div>
          <div class="header-center">
              <div class="header-center-content">
                  <i class="bi bi-battery-full"></i>
                  <div class="header-center-voltage">
                      <h1>Voltage:<span id="voltage">0.00</span>V</h1>
                      <h1>Current:<span id="current">0.00</span>A</h1>
                  </div>
              </div>
              <div class="header-center-content">
                  <i class="bi bi-thermometer"></i>
                  <h1>Temperature:<span id="temperature">0.00</span>°C</h1>
                  <i class="bi bi-airplane-engines"></i>
                  <div class="header-center-voltage">
                      <h1>Altitude:<span id="altitude">0.00</span>m</h1>
                      <h1>Pressure:<span id="pressure">0</span>pa</h1>
                  </div>
              </div>
          </div>
          <div class="header-right">
              <button id="connect-button">Connect</button>
          </div>
        </div>
        <div class="app"><canvas></canvas></div>
        <div class="footer"></div>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
