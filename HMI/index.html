<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hexapod</title>
        <link rel="stylesheet" href="./style.css" type="text/css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="shortcut icon" href="./bot.ico">
    </head>
    <body>
        <div class="popup" id="popup"></div>
        <div id="panel"></div>
        <div class="header">
            <div class="header-left">
                <h1>Hexapod<span id="version">V0.0</span></h1>
            </div>
          <div class="header-center">
          </div>
          <div class="header-right">
          </div>
        </div>
        <div class="app"><canvas></canvas></div>

        <div class="footer">
            <div class="carousel">
                <div class="carousel-items">
                    <div class="carousel-item">
                        <div class="carousel-item-content">
                            <i class="bi bi-battery-full"></i>
                            <div class="carousel-item-content-value">
                                <div class="carousel-item-content-value-title"><span id="voltage">_</span>V</div>
                                <div class="carousel-item-content-value-title"><span id="current">_</span>A</div>
                                <div class="carousel-item-content-value-title"><span id="temperature">_</span>°C</div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="carousel-item-content">
                            <i class="bi bi-compass"></i>
                            <div class="carousel-item-content-value">
                                <div class="carousel-item-content-value-title">roll:<span id="roll">_</span>°</div>
                                <div class="carousel-item-content-value-title">pitch:<span id="pitch">_</span>°</div>
                                <div class="carousel-item-content-value-title">yaw:<span id="yaw">_</span>°</div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="carousel-item-content">
                            <i class="bi bi-activity"></i>
                            <div class="carousel-item-content-value">
                                <div class="carousel-item-content-value-title">msg:
                                    <div class="carousel-item-content-value-content">
                                        <div class="progressbar">
                                            <div class="progressbar-container" id="progress-message-queue" style="width:0"></div>
                                            <div class="progressbar-value" id="progress-message-queue-val"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="carousel-item-content-value-title">max:<span id="max-time">_</span>ms</div>
                                <div class="carousel-item-content-value-title">min:<span id="min-time">_</span>ms</div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="carousel-item-content">
                            <i class="bi bi-motherboard"></i>
                            <div class="carousel-item-content-value">
                                <div class="carousel-item-content-value-title">BP:<span id="button">Released</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="carousel-item-content">
                            <i class="bi bi-airplane-engines"></i>
                            <div class="carousel-item-content-value">
                                <div><span id="altitude">0.00</span>m</div>
                                <div><span id="pressure">0.00</span>pa</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
